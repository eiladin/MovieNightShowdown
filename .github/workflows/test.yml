name: Test

# Tags are excluded: a tag push is a release, handled by docker-publish.yml,
# and the commit it points at was already tested on its branch and PR.
on:
  push:
    branches: [ "**" ]
    tags-ignore: [ "**" ]
  pull_request:

permissions:
  contents: read

# The two suites are independent jobs rather than steps in one, so a failure
# names the language that broke and neither waits on the other.
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
